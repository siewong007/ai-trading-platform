name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          cd target/release
          tar czf "trading_platform-${{ matrix.target }}.tar.gz" trading_platform
          mv "trading_platform-${{ matrix.target }}.tar.gz" ../..
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: trading_platform-${{ matrix.target }}.tar.gz
