# session_ema_rsi — EMA/RSI pullback gated to a UTC entry window
# (gen-2 registered lead: docs/superpowers/specs/2026-08-25-research-gen2-design.md)
# Grid varies ONLY entry_window_utc: {"00-08","00-12","22-06"} frozen.
[strategy]
name = "session_ema_rsi"
pairs = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT"]
timeframe = "1h"
entry_window_utc = "00-08"
ema_fast = 50
ema_slow = 200
rsi_period = 14
rsi_entry_threshold = 35.0
atr_period = 14
atr_multiplier = 2.0
risk_reward_ratio = 1.5

[backtest]
start_equity_usd = 200.0
risk_per_trade_usd = 2.0
max_notional_pct_equity = 0.5
min_notional_usd = 15.0
