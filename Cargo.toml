[package]
name = "trading_platform"
version = "0.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/siewong007/ai-trading-platform"
description = "Personal Binance spot trading lab: EMA/RSI with ATR stops and a pre-registered backtest gate"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

[dev-dependencies]
wiremock = "0.6"

[profile.release]
opt-level = 3

